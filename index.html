<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b19"><title>Nocturne Glasshouse 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111c1a;color:#f3eee2;font-family:system-ui,-apple-system,sans-serif}#view{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
header{position:fixed;z-index:2;top:env(safe-area-inset-top,12px);left:0;right:0;padding:15px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand{font:24px Georgia,serif;text-shadow:0 2px 8px #000}.brand small{display:block;font:10px system-ui;letter-spacing:.16em;text-transform:uppercase;color:#c7cabb;margin-top:4px}button{border:1px solid #d5dfd044;border-radius:12px;background:#182a25ed;color:#f3eee2;padding:10px 12px;font-size:12px;min-height:40px;pointer-events:auto}.bar{position:fixed;z-index:2;bottom:calc(12px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:8px}.active{background:#b68b52;color:#171914}#msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:#eee9dc;background:#111c1a;z-index:5}#msg[hidden]{display:none}#msg p{max-width:34em;line-height:1.5;color:#c5cec5}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head>
<body><div id="view"></div><header><div class="brand">The Nocturne Glasshouse<small>Victorian conservatory · dusk study</small></div><button id="reset">Reset view</button></header><nav class="bar"><button data-v="overview" class="active">Overview</button><button data-v="front">Front</button><button data-v="top">Top</button><button id="spin">Auto rotate</button><button id="full">Full screen</button></nav>
<div id="msg"><div><b>Loading 3D glasshouse…</b><p>Loading the interactive 3D engine. Please keep this page open and connected to the internet.</p></div></div>
<script type="module">
try{
const THREE=await import('three');const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');
const host=document.querySelector('#view'),scene=new THREE.Scene();scene.background=new THREE.Color('#877b8b');scene.fog=new THREE.FogExp2('#877b8b',.012);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,150);camera.position.set(14,10,18);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,4,0);controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=7;controls.maxDistance=36;controls.maxPolarAngle=Math.PI*.97;
scene.add(new THREE.HemisphereLight('#dce8e2','#28352d',2));const moonLight=new THREE.DirectionalLight('#d9d6ef',2);moonLight.position.set(-8,15,9);scene.add(moonLight);const glow=new THREE.PointLight('#ffb45f',65,20);glow.position.set(0,5,0);scene.add(glow);
const mat=(c,m=0,r=.55,o={})=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r,...o}),iron=mat('#173a32',.7,.3),brass=mat('#b88a42',.75,.25),glass=mat('#a8d4c1',.1,.18,{transparent:true,opacity:.22,side:THREE.DoubleSide}),green=mat('#526f4a'),green2=mat('#7d945e'),potmat=mat('#a95738'),stone=mat('#8b8678'),soil=mat('#29372e');
const ground=new THREE.Mesh(new THREE.CircleGeometry(80,64),soil);ground.rotation.x=-Math.PI/2;ground.position.y=-.1;scene.add(ground);const terrace=new THREE.Mesh(new THREE.CylinderGeometry(8.5,8.8,.3,8),stone);terrace.position.y=.05;scene.add(terrace);
const R=4.1,H=3,dh=3.9,N=16;
function rod(a,b,rad,material){const d=new THREE.Vector3().subVectors(b,a),m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,d.length(),8),material);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());scene.add(m);return m}
for(const [y,rad,ma] of [[.65,.08,iron],[H,.1,brass]]){const ring=new THREE.Mesh(new THREE.TorusGeometry(R,rad,8,64),ma);ring.rotation.x=Math.PI/2;ring.position.y=y;scene.add(ring)}
for(let i=0;i<N;i++){const a=i*2*Math.PI/N,x=Math.cos(a),z=Math.sin(a);rod(new THREE.Vector3(x*R,.65,z*R),new THREE.Vector3(x*R,H,z*R),.065,iron);const pane=new THREE.Mesh(new THREE.PlaneGeometry(1.58,2.28),glass);pane.position.set(x*R*.94,1.82,z*R*.94);pane.rotation.y=-a-Math.PI/2;scene.add(pane)}
const dome=new THREE.Mesh(new THREE.SphereGeometry(R,48,28,0,Math.PI*2,0,Math.PI/2),glass);dome.position.y=H;scene.add(dome);
for(let i=0;i<N;i++){const a=i*2*Math.PI/N,pts=[];for(let k=0;k<=36;k++){const t=Math.PI/2*k/36;pts.push(new THREE.Vector3((R+.03)*Math.sin(t)*Math.cos(a),H+dh*Math.cos(t),(R+.03)*Math.sin(t)*Math.sin(a)))}const curve=new THREE.CatmullRomCurve3(pts);scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve,40,.055,7,false),iron))}
for(const t of [.25,.5,.72,.9]){const rr=R*Math.sin(t*Math.PI/2),y=H+dh*Math.cos(t*Math.PI/2),ring=new THREE.Mesh(new THREE.TorusGeometry(rr,.035,6,64),brass);ring.rotation.x=Math.PI/2;ring.position.y=y;scene.add(ring)}
const finial=new THREE.Mesh(new THREE.ConeGeometry(.14,.48,12),brass);finial.position.y=H+dh+.55;scene.add(finial);rod(new THREE.Vector3(0,H+dh,0),new THREE.Vector3(0,H+dh+.35,0),.045,brass);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(3.9,3.9,.1,16),mat('#52645a'));floor.position.y=.7;scene.add(floor);
for(let i=0;i<16;i++){const a=i*2*Math.PI/16,x=3.35*Math.cos(a),z=3.35*Math.sin(a),pot=new THREE.Mesh(new THREE.CylinderGeometry(.2,.14,.3,10),potmat);pot.position.set(x,.9,z);scene.add(pot);for(let j=0;j<5;j++){const leaf=new THREE.Mesh(new THREE.SphereGeometry(.17,8,6),j%2?green:green2);leaf.scale.set(.7,1.6,.55);leaf.position.set(x+Math.cos(j*2.4)*.18,1.3+(j%3)*.12,z+Math.sin(j*2.4)*.18);scene.add(leaf)}}
for(let i=0;i<8;i++){const a=i*Math.PI/4,x=6.2*Math.cos(a),z=6.2*Math.sin(a),p=new THREE.Mesh(new THREE.CylinderGeometry(.34,.27,.5,10),potmat);p.position.set(x,.5,z);scene.add(p);const bush=new THREE.Mesh(new THREE.IcosahedronGeometry(.7,1),green);bush.position.set(x,1.1,z);scene.add(bush)}
for(let i=0;i<18;i++){const a=i*2*Math.PI/18,x=Math.cos(a)*(13+Math.random()*2),z=Math.sin(a)*(13+Math.random()*2),trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,3.5,7),mat('#334337'));trunk.position.set(x,1.75,z);scene.add(trunk);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.5,1),mat('#3b5140'));crown.position.set(x,4,z);crown.scale.y=.7;scene.add(crown)}
const moon=new THREE.Mesh(new THREE.SphereGeometry(.6,20,16),mat('#f4d9a2',0,.3,{emissive:'#c28d4d',emissiveIntensity:.2}));moon.position.set(-13,13,-20);scene.add(moon);
function view(v){controls.autoRotate=false;document.querySelector('#spin').classList.remove('active');document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v));camera.position.set(...(v==='front'?[0,7,22]:v==='top'?[0,24,.01]:[14,10,18]));controls.target.set(0,4,0);controls.update()}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));document.querySelector('#reset').onclick=()=>view('overview');document.querySelector('#spin').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.classList.toggle('active',controls.autoRotate)};document.querySelector('#full').onclick=()=>document.documentElement.requestFullscreen?.().catch(()=>{});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5))});
document.querySelector('#msg').hidden=true;function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
}catch(e){console.error(e);const m=document.querySelector('#msg');m.hidden=false;m.innerHTML='<div><b>Unable to start 3D viewer</b><p>'+String(e.message)+'<br>Open this page in Safari with an internet connection and reload.</p></div>'}
</script></body></html>
