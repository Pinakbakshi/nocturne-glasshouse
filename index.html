<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b19"><title>Nocturne Glasshouse 3D</title>
<style>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head>
<body><div id="view"></div><header><div class="brand">The Nocturne Glasshouse<small>Victorian conservatory · dusk study</small></div><button id="reset">Reset view</button></header><nav class="bar"><button data-v="overview" class="active">Overview</button><button data-v="front">Front</button><button data-v="top">Top</button><button id="spin">Auto rotate</button><button id="full">Full screen</button></nav>
<div id="msg"><div><b>Loading 3D glasshouse…</b><p>Loading the interactive 3D engine. Please keep this page open and connected to the internet.</p></div></div>
<script type="module">
try{
const THREE=await import('three');const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');
const host=document.querySelector('#view'),scene=new THREE.Scene();scene.background=new THREE.Color('#877b8b');scene.fog=new THREE.FogExp2('#877b8b',.012);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,150);camera.position.set(14,10,18);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.65));renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMappingExposure=1.08;renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,4,0);controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=7;controls.maxDistance=36;controls.maxPolarAngle=Math.PI*.97;
scene.add(new THREE.HemisphereLight('#dce8e2','#28352d',2));const moonLight=new THREE.DirectionalLight('#d9d6ef',2.4);moonLight.position.set(-8,15,9);scene.add(moonLight);moonLight.castShadow=true;moonLight.shadow.mapSize.set(1024,1024);const warmFill=new THREE.PointLight('#ffb66b',85,26);warmFill.position.set(0,5.8,0);scene.add(warmFill);const rimLight=new THREE.PointLight('#91c9b5',30,22);rimLight.position.set(-5,4,-4);scene.add(rimLight);
const mat=(c,m=0,r=.55,o={})=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r,...o}),iron=mat('#102c26',.82,.26),ironHi=mat('#31564a',.78,.3),brass=mat('#c49a55',.78,.23),agedBrass=mat('#806039',.72,.38),glass=mat('#a8d4c1',.12,.12,{transparent:true,opacity:.16,side:THREE.DoubleSide,depthWrite:false}),green=mat('#526f4a'),green2=mat('#7d945e'),leafDark=mat('#294b37'),potmat=mat('#a95738'),terra=mat('#c17b53'),stone=mat('#8b8678'),soil=mat('#29372e'),warmGlass=mat('#ffd18a',.05,.2,{emissive:'#ff9d3b',emissiveIntensity:.8});
const ground=new THREE.Mesh(new THREE.CircleGeometry(80,64),soil);ground.rotation.x=-Math.PI/2;ground.position.y=-.1;scene.add(ground);const terrace=new THREE.Mesh(new THREE.CylinderGeometry(8.5,8.8,.3,8),stone);terrace.position.y=.05;scene.add(terrace);
const R=4.1,H=3,dh=3.9,N=16;
function rod(a,b,rad,material){const d=new THREE.Vector3().subVectors(b,a),m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,d.length(),8),material);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());scene.add(m);return m}
for(const [y,rad,ma] of [[.65,.08,iron],[H,.1,brass]]){const ring=new THREE.Mesh(new THREE.TorusGeometry(R,rad,8,64),ma);ring.rotation.x=Math.PI/2;ring.position.y=y;scene.add(ring)}
for(let i=0;i<N;i++){const a=i*2*Math.PI/N,x=Math.cos(a),z=Math.sin(a);rod(new THREE.Vector3(x*R,.65,z*R),new THREE.Vector3(x*R,H,z*R),.065,iron);const pane=new THREE.Mesh(new THREE.PlaneGeometry(1.58,2.28),glass);pane.position.set(x*R*.94,1.82,z*R*.94);pane.rotation.y=-a-Math.PI/2;scene.add(pane)}
const dome=new THREE.Mesh(new THREE.SphereGeometry(R,48,28,0,Math.PI*2,0,Math.PI/2),glass);dome.position.y=H;scene.add(dome);
for(let i=0;i<N;i++){const a=i*2*Math.PI/N,pts=[];for(let k=0;k<=36;k++){const t=Math.PI/2*k/36;pts.push(new THREE.Vector3((R+.03)*Math.sin(t)*Math.cos(a),H+dh*Math.cos(t),(R+.03)*Math.sin(t)*Math.sin(a)))}const curve=new THREE.CatmullRomCurve3(pts);scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve,40,.055,7,false),iron))}
for(const t of [.25,.5,.72,.9]){const rr=R*Math.sin(t*Math.PI/2),y=H+dh*Math.cos(t*Math.PI/2),ring=new THREE.Mesh(new THREE.TorusGeometry(rr,.035,6,64),brass);ring.rotation.x=Math.PI/2;ring.position.y=y;scene.add(ring)}
const finial=new THREE.Mesh(new THREE.ConeGeometry(.14,.48,12),brass);finial.position.y=H+dh+.55;scene.add(finial);rod(new THREE.Vector3(0,H+dh,0),new THREE.Vector3(0,H+dh+.35,0),.045,brass);
// Ornate Victorian detailing: repeated arched tracery, collars, and fine mullions.
for(let i=0;i<N;i++){const a=i*2*Math.PI/N,x=Math.cos(a),z=Math.sin(a);const archPts=[];for(let k=0;k<=24;k++){const t=Math.PI*k/24;archPts.push(new THREE.Vector3(x*(R+.035),1.05+1.42*Math.sin(t),z*(R+.035)))}const arch=new THREE.CatmullRomCurve3(archPts);scene.add(new THREE.Mesh(new THREE.TubeGeometry(arch,32,.035,6,false),brass));rod(new THREE.Vector3(x*(R+.04),.9,z*(R+.04)),new THREE.Vector3(x*(R+.04),1.15,z*(R+.04)),.035,ironHi);const collar=new THREE.Mesh(new THREE.TorusGeometry(.12,.025,6,20),brass);collar.rotation.x=Math.PI/2;collar.position.set(x*R,.82,z*R);scene.add(collar)}
// Continuous interior perimeter plant shelves with delicate brass brackets.
for(const y of [1.75,2.65]){const shelf=new THREE.Mesh(new THREE.CylinderGeometry(3.62,3.62,.10,16,1,true),mat('#344b40',.35,.42,{side:THREE.DoubleSide}));shelf.position.y=y;shelf.scale.set(1,1,1);scene.add(shelf);for(let i=0;i<N;i++){const a=i*2*Math.PI/N,x=Math.cos(a),z=Math.sin(a);rod(new THREE.Vector3(x*3.35,y-.34,z*3.35),new THREE.Vector3(x*3.72,y,z*3.72),.025,agedBrass)}}
// Roof glazing ribs receive finer secondary bars and brass joints.
for(let i=0;i<N*2;i++){const a=i*2*Math.PI/(N*2),p1=new THREE.Vector3(Math.cos(a)*(R+.06),H,Math.sin(a)*(R+.06)),p2=new THREE.Vector3(0,H+dh,0);rod(p1,p2,.018,brass);const jewel=new THREE.Mesh(new THREE.SphereGeometry(.075,8,8),brass);jewel.position.copy(p1);scene.add(jewel)}
const floor=new THREE.Mesh(new THREE.CylinderGeometry(3.9,3.9,.1,16),mat('#52645a'));floor.position.y=.7;scene.add(floor);
// Central radial stone paving and gravel terrace.
for(let i=0;i<48;i++){const a=i*2*Math.PI/48,r=4.35+(i%3)*.72,block=new THREE.Mesh(new THREE.BoxGeometry(.48,.055,.22),mat(i%2?'#9b9587':'#77786f',0,.9));block.position.set(Math.cos(a)*r,.23,Math.sin(a)*r);block.rotation.y=-a;scene.add(block)}
for(let i=0;i<260;i++){const a=Math.random()*Math.PI*2,r=4.8+Math.random()*3.3,pebble=new THREE.Mesh(new THREE.DodecahedronGeometry(.035+Math.random()*.045,0),mat(i%3?'#77766e':'#aaa18e',0,.95));pebble.position.set(Math.cos(a)*r,.22,Math.sin(a)*r);pebble.scale.y=.35;scene.add(pebble)}
for(let i=0;i<20;i++){const a=i*2*Math.PI/20,x=3.28*Math.cos(a),z=3.28*Math.sin(a),pot=new THREE.Mesh(new THREE.CylinderGeometry(.23,.16,.34,16),i%2?potmat:terra);pot.position.set(x,.94,z);scene.add(pot);const rim=new THREE.Mesh(new THREE.TorusGeometry(.205,.025,6,18),agedBrass);rim.rotation.x=Math.PI/2;rim.position.set(x,1.12,z);scene.add(rim);for(let j=0;j<7;j++){const leaf=new THREE.Mesh(new THREE.SphereGeometry(.15,8,6),j%3?green:green2);leaf.scale.set(.45,1.9,.48);leaf.position.set(x+Math.cos(j*2.4)*.19,1.35+(j%3)*.13,z+Math.sin(j*2.4)*.19);leaf.rotation.z=Math.cos(j*2.4)*.35;scene.add(leaf)}}
// Tall specimen plants and climbing ivy on the interior posts.
for(let i=0;i<8;i++){const a=i*Math.PI/4,x=2.35*Math.cos(a),z=2.35*Math.sin(a);for(let j=0;j<9;j++){const t=j/8,leaf=new THREE.Mesh(new THREE.SphereGeometry(.12,7,6),j%2?leafDark:green2);leaf.scale.set(.45,1.6,.38);leaf.position.set(x+Math.sin(t*9+i)*.22,.9+t*2.5,z+Math.cos(t*9+i)*.22);scene.add(leaf)}}
for(let i=0;i<12;i++){const a=i*Math.PI/6,x=6.2*Math.cos(a),z=6.2*Math.sin(a),p=new THREE.Mesh(new THREE.CylinderGeometry(.34,.27,.5,14),potmat);p.position.set(x,.5,z);scene.add(p);const bush=new THREE.Mesh(new THREE.IcosahedronGeometry(.7,1),green);bush.position.set(x,1.1,z);scene.add(bush)}
// Four warm hanging lanterns with brass cages and visible luminous cores.
for(const [x,z] of [[-2.5,-1.8],[2.5,-1.8],[-2.5,1.8],[2.5,1.8]]){rod(new THREE.Vector3(x,4.8,z),new THREE.Vector3(x,4.15,z),.025,brass);const cage=new THREE.Mesh(new THREE.BoxGeometry(.42,.62,.42),agedBrass);cage.position.set(x,3.88,z);scene.add(cage);const lamp=new THREE.Mesh(new THREE.SphereGeometry(.17,12,10),warmGlass);lamp.position.set(x,3.88,z);scene.add(lamp);const light=new THREE.PointLight('#ffb45f',24,7);light.position.set(x,3.8,z);scene.add(light)}
for(let i=0;i<18;i++){const a=i*2*Math.PI/18,x=Math.cos(a)*(13+Math.random()*2),z=Math.sin(a)*(13+Math.random()*2),trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,3.5,7),mat('#334337'));trunk.position.set(x,1.75,z);scene.add(trunk);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.5,1),mat('#3b5140'));crown.position.set(x,4,z);crown.scale.y=.7;scene.add(crown)}
const moon=new THREE.Mesh(new THREE.SphereGeometry(.6,20,16),mat('#f4d9a2',0,.3,{emissive:'#c28d4d',emissiveIntensity:.2}));moon.position.set(-13,13,-20);scene.add(moon);
function view(v){controls.autoRotate=false;document.querySelector('#spin').classList.remove('active');document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v));camera.position.set(...(v==='front'?[0,7,22]:v==='top'?[0,24,.01]:[14,10,18]));controls.target.set(0,4,0);controls.update()}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));document.querySelector('#reset').onclick=()=>view('overview');document.querySelector('#spin').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.classList.toggle('active',controls.autoRotate)};document.querySelector('#full').onclick=()=>document.documentElement.requestFullscreen?.().catch(()=>{});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5))});
// Floating fireflies and moth-like points of light animate gently around the terrace.
const fireflies=[];for(let i=0;i<34;i++){const sprite=new THREE.Mesh(new THREE.SphereGeometry(.035+Math.random()*.025,6,6),new THREE.MeshBasicMaterial({color:i%3?'#ffd98a':'#c7e7b2'}));sprite.userData={a:Math.random()*Math.PI*2,r:5+Math.random()*5,y:1+Math.random()*4,s:.35+Math.random()*.5};scene.add(sprite);fireflies.push(sprite)}
// Soft dusk sky and more natural camera framing.
camera.position.set(12,8.2,15);controls.target.set(0,3.4,0);controls.maxDistance=30;
document.querySelector('#msg').hidden=true;function animate(){requestAnimationFrame(animate);const t=performance.now()*.001;fireflies.forEach((f,i)=>{const d=f.userData;f.position.set(Math.cos(d.a+t*d.s*.16)*d.r,d.y+Math.sin(t*d.s+i)*.28,Math.sin(d.a+t*d.s*.16)*d.r);f.material.opacity=.5+.5*Math.sin(t*2+i);});controls.update();renderer.render(scene,camera)}animate();
}catch(e){console.error(e);const m=document.querySelector('#msg');m.hidden=false;m.innerHTML='<div><b>Unable to start 3D viewer</b><p>'+String(e.message)+'<br>Open this page in Safari with an internet connection and reload.</p></div>'}
</script></body></html>
